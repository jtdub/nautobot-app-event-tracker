---
nautobot_event_tracker:
  nautobot_ver: "3.2.0"
  python_ver: "3.12"
  # local: false
  # ephemeral_ports: false
  # compose_dir: "/full/path/to/nautobot-app-event-tracker/development"

  # The containerlab lab: a three-node SR Linux fabric whose logs are real, a Redpanda broker, the
  # syslog bridge between them, and a running event consumer. Turning this on adds all four to the
  # ordinary development stack, so `invoke start` brings up a Nautobot that is consuming events and
  # `invoke logs -s consumer` shows what it made of them.
  #
  # It costs about 8 GB of memory and needs containerlab and privileged Docker. Leave it off - or
  # leave this file alone entirely - and nothing here behaves any differently than it always has.
  #
  # `invoke lab-up` turns it on for its own run whatever this says, so it is only worth setting if
  # you work on ingestion often enough to want the lab to be your normal environment. Deploy the
  # topology first: `invoke lab-up` does that, and the broker's containers attach to the management
  # network containerlab creates.
  #
  # See docs/dev/lab.md.
  # lab: false
