---
extends: "default"
rules:
  comments: "enable"
  empty-values: "disable"
  indentation:
    indent-sequences: "consistent"
  line-length: "disable"
  quoted-strings:
    quote-type: "double"
ignore: |
  .venv/
  compose.yaml
  # containerlab writes an inventory and per-node state beside the topology while the lab is up.
  # Generated by another tool, to its own conventions, and gone again on `invoke lab-down`.
  development/containerlab/clab-*/
