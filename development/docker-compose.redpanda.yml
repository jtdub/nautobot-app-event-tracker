---
# The lab's broker and syslog bridge, layered on the ordinary development stack the way the redis
# overlay is. Nothing here starts unless you ask for it: add this file to `compose_files` in your
# `invoke.yml`, as docs/dev/lab.md describes, and leave it out to get the ordinary stack back.
#
# Redpanda rather than Kafka and ZooKeeper: one container, a few hundred megabytes, no controller to
# configure, and it speaks the Kafka protocol - `confluent-kafka` cannot tell the difference, which
# is the entire point. The reference deployment in ADR 0004 is still Kafka; this is the development
# stand-in for it.
services:
  redpanda:
    image: "redpandadata/redpanda:v24.2.7"
    command:
      - "redpanda"
      - "start"
      - "--mode=dev-container"
      - "--smp=1"
      - "--memory=512M"
      - "--reserve-memory=0M"
      - "--overprovisioned"
      - "--kafka-addr=PLAINTEXT://0.0.0.0:9092"
      # Advertised as the service name, because the consumer connects from inside the compose
      # network and the bridge does too.
      - "--advertise-kafka-addr=PLAINTEXT://redpanda:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: "5s"
      timeout: "5s"
      retries: 12
    networks:
      default: {}
      # The bridge and the devices share the management network containerlab creates.
      event-tracker-mgmt: {}

  fluent-bit:
    image: "fluent/fluent-bit:3.1"
    depends_on:
      redpanda:
        condition: "service_healthy"
    volumes:
      - "./containerlab/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro"
      - "./containerlab/parsers.conf:/fluent-bit/etc/parsers.conf:ro"
      - "./containerlab/classify.lua:/fluent-bit/etc/classify.lua:ro"
    networks:
      default: {}
      event-tracker-mgmt:
        # The address every device's startup configuration exports syslog to.
        ipv4_address: "172.30.30.100"

  # Worth a great deal the first time the field map does not match, and nothing afterwards. Start it
  # with `docker compose ... --profile console up -d`.
  redpanda-console:
    image: "redpandadata/console:v2.7.2"
    profiles:
      - "console"
    depends_on:
      redpanda:
        condition: "service_healthy"
    environment:
      KAFKA_BROKERS: "redpanda:9092"
    ports:
      - "8090:8080"

networks:
  # Created by containerlab from topology.clab.yml. Declared external so that compose attaches to
  # the devices' network rather than making a second one with the same name.
  event-tracker-mgmt:
    external: true
    name: "event-tracker-mgmt"
