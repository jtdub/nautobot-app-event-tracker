---
services:
  nautobot:
    environment:
      - "NAUTOBOT_DB_ENGINE=django.db.backends.postgresql"
  db:
    # pgvector's image rather than the stock one, because ADR 0003 requires the extension from
    # Phase 5 onward and `postgres:17-alpine` does not carry it - `pg_available_extensions` has no
    # vector entry at all. Same PostgreSQL major version, so an existing data volume is reused
    # rather than rebuilt.
    image: "pgvector/pgvector:pg17"
    command:
      - "-c"
      - "max_connections=200"
    env_file:
      - "development.env"
      - "creds.env"
    volumes:
      - "postgres_data:/var/lib/postgresql/data"
    healthcheck:
      test: "pg_isready --username=$$POSTGRES_USER --dbname=$$POSTGRES_DB"
      interval: "10s"
      timeout: "5s"
      retries: 10

volumes:
  postgres_data: {}
