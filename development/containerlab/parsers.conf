# SR Linux's syslog line, taken apart.
#
# A line looks like:
#
#     <139>1 2026-08-15T03:14:00.123Z leaf-01 sr_linux_mgr 1234 - - Interface ethernet-1/1 is down
#
# The priority is facility * 8 + severity; Fluent Bit's syslog input decodes it and hands back
# `pri`, `host`, `ident` and `message`. 139 is local1 (17 * 8 = 136) plus severity 3, error - which
# is what `classify.lua` passes on and what the lab's severity_map turns into `major`. The regex
# below is the fallback for lines the RFC5424 parser refuses, which SR Linux does emit for some
# subsystems.

[PARSER]
    Name        srlinux-syslog
    Format      regex
    Regex       ^\<(?<pri>[0-9]+)\>[0-9]* *(?<time>[^ ]*) +(?<host>[^ ]+) +(?<ident>[^ ]+) +(?<pid>[-0-9]+) +[^ ]+ +[^ ]+ +(?<message>.*)$
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S.%L%z
    Time_Keep   On
