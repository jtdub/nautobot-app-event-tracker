# The bridge: syslog in from the devices, JSON out to the broker.
#
# This file is the answer to "where do the dotted paths in the field map come from". If it and
# PLUGINS_CONFIG['nautobot_event_tracker']['ingestion']['topics'] disagree, one of them is wrong,
# and the lab acceptance check (spec 9.5) is what discovers which.
#
# The shape it produces, which the lab's field map is written against:
#
#     {
#       "host": "leaf-01",
#       "message": "Interface ethernet-1/1 is down",
#       "event": {"type": "Interface Down", "severity": "3"},
#       "timestamp": "2026-08-15T03:14:00Z"
#     }

[SERVICE]
    Flush         1
    Log_Level     info
    Parsers_File  parsers.conf

[INPUT]
    Name          syslog
    Mode          udp
    Listen        0.0.0.0
    Port          5140
    Parser        srlinux-syslog
    Tag           network.events

# The device sends a severity number and a free-text message. The event type has to be derived from
# the text, because syslog carries no such field - this is the one piece of guesswork in the bridge,
# and the place to look first when a ticket comes out as Unclassified.
[FILTER]
    Name          lua
    Match         network.events
    script        classify.lua
    call          classify

[OUTPUT]
    Name          kafka
    Match         network.events
    Brokers       redpanda:9092
    Topics        network.events
    Timestamp_Key timestamp
    Timestamp_Format iso8601
    rdkafka.log.connection.close false
