---
# A small SR Linux fabric whose logs are real.
#
# The point of this lab is not the topology - it is that a device, rather than a fixture, decides
# what a syslog message looks like. The Phase 2 field map was written from what a syslog payload
# usually looks like; this is what turns that into evidence.
#
# Cost: each SR Linux node wants roughly 1 GB of memory and tens of seconds to boot. Three of them
# plus Redpanda, Nautobot, PostgreSQL and Redis needs an 8 GB machine, comfortably 12. containerlab
# also needs privileged Docker and manages network namespaces directly, so it does not run in every
# sandbox. Nothing else in this repository requires any of it.
#
#     leaf-01 ────────── leaf-02
#         │                │
#         └──── spine-01 ──┘
#                  │
#              client-01

name: event-tracker

mgmt:
  network: event-tracker-mgmt
  ipv4-subnet: 172.30.30.0/24

topology:
  kinds:
    nokia_srlinux:
      # Publicly pullable and needs no licence, which is most of why this lab exists at all.
      image: ghcr.io/nokia/srlinux:24.10.1
    linux:
      image: alpine:3.20

  nodes:
    # One startup config per node rather than one shared by all three: they export syslog to the
    # same bridge, but the fabric addressing, the AS number, the router-id and the neighbours are
    # each node's own. A shared config gave every node the same router-id and no neighbours at all,
    # which meant no session ever came up and no session could ever go down.
    leaf-01:
      kind: nokia_srlinux
      mgmt-ipv4: 172.30.30.11
      startup-config: leaf-01.cli
    leaf-02:
      kind: nokia_srlinux
      mgmt-ipv4: 172.30.30.12
      startup-config: leaf-02.cli
    spine-01:
      kind: nokia_srlinux
      mgmt-ipv4: 172.30.30.13
      startup-config: spine-01.cli
    client-01:
      kind: linux
      mgmt-ipv4: 172.30.30.21
      exec:
        - ip address add 10.0.0.10/24 dev eth1
        - ip route add 10.0.0.0/8 via 10.0.0.1

  links:
    # The fabric. Shutting either leaf-to-spine link produces an Interface Down event on both ends
    # and, once BGP is up, a BGP Session Down alongside it.
    - endpoints: ["leaf-01:e1-1", "spine-01:e1-1"]
    - endpoints: ["leaf-02:e1-1", "spine-01:e1-2"]
    # The leaves are connected directly so that a link can be broken without isolating a node.
    - endpoints: ["leaf-01:e1-2", "leaf-02:e1-2"]
    # Somewhere to send traffic from, so an outage is visible as more than a log line.
    - endpoints: ["client-01:eth1", "leaf-01:e1-3"]
